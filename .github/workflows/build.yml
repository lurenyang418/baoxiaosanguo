name: 构建多平台版本

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: 导出 macOS、Windows、Android 与 iOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Godot 与导出模板
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: 配置 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.1
            ndk;28.1.13356709
            cmake;3.10.2.4988404

      - name: 检查构建工具
        run: |
          godot --version
          java -version
          xcodebuild -version
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: 导出 macOS Apple Silicon
        run: ./scripts/build_macos.sh --release --arm64

      - name: 导出 macOS Intel
        run: ./scripts/build_macos.sh --release --x86_64

      - name: 导出 Windows x64
        run: ./scripts/build_windows.sh --release

      - name: 导出 Android ARM64
        run: ./scripts/build_android.sh --release

      - name: 导出 iOS Xcode 工程
        run: |
          ./scripts/build_ios.sh
          ditto -c -k --sequesterRsrc --keepParent build/ios-xcode build/ios-xcode-project.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: baoxiaosanguo-${{ github.sha }}
          path: |
            build/BaoXiaoSanGuo-arm64.dmg
            build/BaoXiaoSanGuo-x86_64.dmg
            build/BaoXiaoSanGuo-windows-x64.exe
            build/android/baoxiaosanguo-release.apk
            build/ios-xcode-project.zip
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            build/BaoXiaoSanGuo-arm64.dmg \
            build/BaoXiaoSanGuo-x86_64.dmg \
            build/BaoXiaoSanGuo-windows-x64.exe \
            build/android/baoxiaosanguo-release.apk \
            build/ios-xcode-project.zip \
            --title "爆笑三国 ${version}" \
            --generate-notes
